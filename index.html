<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gastos CAD"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Controle de Gastos CAD — V2.4</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--p:#0f172a;--g:#087f5b;--r:#c92a2a;--b:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:var(--p);color:#fff;padding:20px 15px;position:sticky;top:0;z-index:5}header h1{font-size:21px;margin:0 0 3px}header p{margin:0;color:#cbd5e1;font-size:12px}main{max-width:900px;margin:auto;padding:12px 10px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:11px;box-shadow:0 2px 8px #00000008}.card h2{font-size:16px;margin:0 0 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin:0 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #d7dce3;border-radius:11px;padding:10px;background:#fff;color:var(--text)}textarea{min-height:86px;resize:vertical}button{border:0;border-radius:11px;padding:10px 12px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#eef0f3;color:var(--text)}.danger{background:#fff0f0;color:var(--r)}.positive{color:var(--g)}.negative{color:var(--r)}.total{background:linear-gradient(135deg,#0f172a,#29364a);color:#fff;border:0}.small{font-size:12px;color:var(--muted)}.total .small{color:#cbd5e1}.big{font-size:27px;font-weight:800;margin:3px 0 10px}.person{border:1px solid var(--line);border-radius:14px;padding:11px}.person h3{font-size:14px;margin:0 0 6px}.amount{font-size:20px;font-weight:800}.metric{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}.metric span:last-child{font-weight:700}.tabs,.segment{display:flex;gap:5px;background:#edf0f4;border-radius:11px;padding:3px}.tabs button,.segment button{flex:1;background:transparent;color:#667085}.tabs .active,.segment .selected{background:#fff;color:#172033;box-shadow:0 1px 4px #0002}.box{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:10px;margin-top:9px}.tx{border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px}.txhead{display:flex;justify-content:space-between;gap:8px}.txdesc{font-weight:750}.txmeta{font-size:11px;color:var(--muted);margin-top:4px}.txamount{font-weight:800;white-space:nowrap}.badge{font-size:10px;padding:3px 6px;border-radius:99px;background:#eef2f7;margin-left:4px}.income{background:#e8f7ef;color:#087f5b}.expense{background:#fff0f0;color:#b42318}.shared{background:#ede9fe;color:#6d28d9}.actions{display:flex;gap:6px;margin-top:8px}.actions button{padding:7px 9px;font-size:11px}.notice{background:#fff8e7;border:1px solid #f3d58a;color:#7a5b12;border-radius:11px;padding:9px;font-size:11px;margin-top:9px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{flex:1;min-width:120px}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:18px}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>💰 Controle de Gastos CAD</h1><p>2 pessoas • offline • dados salvos no dispositivo</p></header><main>
<section class="card total"><div class="small">SALDO TOTAL</div><div id="total" class="big">CAD 0,00</div><div class="grid"><div><div class="small">Entradas</div><b id="incomeTotal">CAD 0,00</b></div><div><div class="small">Despesas pagas</div><b id="paidTotal">CAD 0,00</b></div></div></section>

<section class="card"><h2>📋 Histórico</h2><div id="history"></div></section>
<section class="card"><h2>💾 Backup e dados</h2><div class="toolbar"><button class="secondary" onclick="exportData()">Exportar backup</button><button class="secondary" onclick="document.getElementById('file').click()">Importar backup</button><button class="danger" onclick="clearAll()">Apagar tudo</button></div><input id="file" type="file" accept=".json" class="hidden" onchange="importData(event)"><div class="small" style="margin-top:8px">Faça backup antes de trocar/restaurar o aparelho.</div></section>
</main><script>
const DB='GastosCADV2',STORE='app',KEY='state';let db,state={people:[{name:'Pessoa 1',initial:7000},{name:'Pessoa 2',initial:3000}],transactions:[]},typ='expense',shared=false,edit=null;
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'CAD'}).format(Number(n)||0),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function updatePersonNames(){
  const names=[state.people[0]?.name?.trim()||'Pessoa 1',state.people[1]?.name?.trim()||'Pessoa 2'];
  ['payer','spayer','receiver'].forEach(id=>{const el=$(id);if(!el)return;const val=el.value;el.options[0].textContent=names[0];el.options[1].textContent=names[1];if(val==='0'||val==='1')el.value=val;});
  document.querySelectorAll('#custom .label').forEach((el,i)=>{if(i<2)el.textContent=names[i]+' (%)';});
  document.querySelectorAll('#ibox .label,#sbox .label').forEach(el=>{if(el.textContent.trim()==='Quem pagou?')el.textContent='Quem pagou?';});
}

function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function get(k){return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(k,v){return new Promise((ok,no)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
async function init(){db=await openDB();let s=await get(KEY);if(s)state=s;else{try{let o=JSON.parse(localStorage.getItem('gastos-cad-pwa-v1'));if(o)state={people:[{name:o.people?.[0]?.name||'Pessoa 1',initial:Number(o.people?.[0]?.initial||7000)},{name:o.people?.[1]?.name||'Pessoa 2',initial:Number(o.people?.[1]?.initial||3000)}],transactions:(o.transactions||[]).map(legacy)}}catch(e){}await put(KEY,state)}$('date').value=today();$('name0').value=state.people[0].name;$('name1i').value=state.people[1].name;$('start0').value=state.people[0].initial;$('start1').value=state.people[1].initial;updatePersonNames();render()}
function legacy(t){let p=Number(t.person??t.payer??0);let type=t.type==='income'?'income':'expense';let split=Array.isArray(t.split)&&t.split.length===2?[Number(t.split[0])||0,Number(t.split[1])||0]:(p?[0,100]:[100,0]);return{id:t.id||crypto.randomUUID(),type,desc:t.desc||t.description||'',amount:Number(t.amount)||0,date:t.date||today(),shared:type==='expense'&&!!t.shared,payer:p,receiver:Number(t.receiver??p),split}}
function calc(){let p=[{initial:+state.people[0].initial||0,income:0,paid:0,share:0},{initial:+state.people[1].initial||0,income:0,paid:0,share:0}];state.transactions.forEach(t=>{if(t.type==='income')p[t.receiver].income+=t.amount;else{p[t.payer].paid+=t.amount;p[0].share+=t.amount*(t.split?.[0]??(t.payer?0:100))/100;p[1].share+=t.amount*(t.split?.[1]??(t.payer?100:0))/100}});return p}
function render(){let p=calc();$('total').textContent=money(p[0].initial+p[1].initial+p[0].income+p[1].income-p[0].share-p[1].share);$('incomeTotal').textContent=money(p[0].income+p[1].income);$('paidTotal').textContent=money(p[0].paid+p[1].paid);for(let i=0;i<2;i++){ $('n'+i).textContent=state.people[i].name;$('bal'+i).textContent=money(p[i].initial+p[i].income-p[i].share);$('bal'+i).className='amount '+((p[i].initial+p[i].income-p[i].share)<0?'negative':'positive');$('ini'+i).textContent=money(p[i].initial);$('inc'+i).textContent=money(p[i].income);$('pay'+i).textContent=money(p[i].paid);$('share'+i).textContent=money(p[i].share)}history()}
function history(){if(!state.transactions.length){$('history').innerHTML='<div class="empty">Nenhum lançamento ainda.</div>';return}$('history').innerHTML=state.transactions.map(t=>{let who=state.people[t.type==='income'?t.receiver:t.payer].name,b=t.type==='income'?'<span class="badge income">ENTRADA</span>':t.shared?'<span class="badge shared">COMPARTILHADA</span>':'<span class="badge expense">DESPESA</span>';let info=t.type==='income'?'Recebeu: '+esc(who):(t.shared?'Pagou: '+esc(who)+' • '+t.split[0]+'% / '+t.split[1]+'%':'Pagou: '+esc(who));return`<div class="tx"><div class="txhead"><div><div class="txdesc">${esc(t.desc)} ${b}</div><div class="txmeta">${esc(t.date)} • ${info}</div></div><div class="txamount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'-'} ${money(t.amount)}</div></div><div class="actions"><button class="secondary" onclick="editTx('${t.id}')">✏️ Editar</button><button class="danger" onclick="delTx('${t.id}')">🗑️ Excluir</button></div></div>`}).join('')}
async function savePeople(){state.people[0].name=$('name0').value.trim()||'Pessoa 1';state.people[1].name=$('name1i').value.trim()||'Pessoa 2';state.people[0].initial=+$('start0').value||0;state.people[1].initial=+$('start1').value||0;await put(KEY,state);updatePersonNames();render();alert('Configuração salva.')}
function typeSet(t){typ=t;$('te').classList.toggle('active',t==='expense');$('ti').classList.toggle('active',t==='income');$('ef').classList.toggle('hidden',t!=='expense');$('if').classList.toggle('hidden',t!=='income')}
function sharedSet(v){shared=v;$('ind').classList.toggle('selected',!v);$('shr').classList.toggle('selected',v);$('ibox').classList.toggle('hidden',v);$('sbox').classList.toggle('hidden',!v)}
function splitUI(){$('custom').classList.toggle('hidden',$('mode').value!=='custom')}
async function saveTx(){let desc=$('desc').value.trim(),amount=+$('amount').value,date=$('date').value||today();if(!desc)return alert('Digite uma descrição.');if(!(amount>0))return alert('Digite um valor maior que zero.');let t={id:edit||crypto.randomUUID(),type:typ,desc,amount,date};if(typ==='income'){t.receiver=+$('receiver').value;t.payer=t.receiver;t.shared=false;t.split=t.receiver?[0,100]:[100,0]}else{t.shared=shared;t.payer=+(shared?$('spayer').value:$('payer').value);if(shared){t.split=$('mode').value==='50'?[50,50]:[+$('s0').value||0,+$('s1').value||0];if(t.split[0]+t.split[1]!==100)return alert('A divisão precisa somar 100%.')}else t.split=t.payer?[0,100]:[100,0]}let i=state.transactions.findIndex(x=>x.id===edit);if(i>=0)state.transactions[i]=t;else state.transactions.unshift(t);await put(KEY,state);cancelEdit();render()}
function editTx(id){let t=state.transactions.find(x=>x.id===id);if(!t)return;edit=id;$('desc').value=t.desc;$('amount').value=t.amount;$('date').value=t.date;typeSet(t.type);if(t.type==='income'){$('receiver').value=t.receiver}else{sharedSet(!!t.shared);if(t.shared){$('spayer').value=t.payer;$('mode').value=t.split[0]===50&&t.split[1]===50?'50':'custom';$('s0').value=t.split[0];$('s1').value=t.split[1];splitUI()}else{$('payer').value=t.payer}}$('save').textContent='Salvar alterações';$('cancel').classList.remove('hidden');scrollTo(0,0)}
function cancelEdit(){edit=null;$('desc').value='';$('amount').value='';$('date').value=today();typeSet('expense');sharedSet(false);$('save').textContent='Adicionar lançamento';$('cancel').classList.add('hidden')}
async function delTx(id){if(confirm('Excluir este lançamento?')){state.transactions=state.transactions.filter(t=>t.id!==id);await put(KEY,state);render()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:3,...state},null,2)],{type:'application/json'}));a.download='backup-gastos-cad-'+today()+'.json';a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result);if(!x.people||!Array.isArray(x.transactions))throw 0;state={people:x.people.slice(0,2).map(p=>({name:p.name||'Pessoa',initial:+p.initial||0})),transactions:x.transactions.map(legacy)};while(state.people.length<2)state.people.push({name:'Pessoa 2',initial:0});await put(KEY,state);location.reload()}catch(err){alert('Backup inválido.')} };r.readAsText(f)}
async function clearAll(){if(confirm('Apagar todos os lançamentos e zerar os saldos iniciais?')){state={people:[{name:'Pessoa 1',initial:0},{name:'Pessoa 2',initial:0}],transactions:[]};await put(KEY,state);location.reload()}}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}));init().catch(e=>alert('Não foi possível abrir o armazenamento local. Evite modo privado.'))
</script></body></html>
